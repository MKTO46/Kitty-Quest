<body>
  <main class="app">
    <section id="today" class="screen active"></section>
    <section id="quests" class="screen"></section>
    <section id="workouts" class="screen"></section>
    <section id="power" class="screen"></section>
    <section id="rewards" class="screen"></section>
  </main>
  <button class="add" aria-label="Add quest" onclick="openQuestDialog()">+</button>
  <nav class="nav"><div class="nav-inner"><button class="active" data-page="today"><i>⌂</i>Today</button><button data-page="quests"><i>☑</i>Quests</button><button data-page="workouts"><i>⌁</i>Train</button><button data-page="power"><i>⟡</i>Power</button><button data-page="rewards"><i>✦</i>Rewards</button></div></nav>
  <dialog id="quest-dialog" class="dialog"><form id="quest-form" method="dialog">
    <h2>New Quest</h2><label for="q-title">Quest name</label><input id="q-title" required maxlength="50" placeholder="e.g. Take a lunchtime walk">
    <label for="q-hint">Helpful hint</label><input id="q-hint" maxlength="80" placeholder="A small next step">
    <label for="q-category">Category</label><select id="q-category"><option value="wellness">Wellness</option><option value="movement">Movement</option><option value="fuel">Fuel</option><option value="focus">Focus</option><option value="home">Home</option></select>
    <label for="q-xp">XP reward</label><select id="q-xp"><option>10</option><option selected>15</option><option>20</option><option>25</option><option>30</option><option>50</option></select>
    <label>Repeat on</label><div class="days" id="day-picker"></div>
    <div class="dialog-actions"><button type="button" class="cancel" onclick="questDialog.close()">Cancel</button><button class="save" value="default">Add quest</button></div>
  </form></dialog>
  <dialog id="log-dialog" class="dialog"><form id="log-form" method="dialog"><h2 id="log-title">Log exercise</h2><p id="log-plan" class="helper"></p><label id="sets-label" for="actual-sets">Sets completed</label><input id="actual-sets" inputmode="numeric" required><label id="reps-label" for="actual-reps">Reps completed</label><input id="actual-reps" inputmode="numeric" required><label for="actual-weight">Weight (optional)</label><input id="actual-weight" placeholder="e.g. 30 lb"><label for="actual-notes">Notes (optional)</label><input id="actual-notes" maxlength="100" placeholder="How did it feel?"><div class="dialog-actions"><button type="button" class="cancel" onclick="logDialog.close()">Cancel</button><button id="log-submit" class="save">Complete +15 XP</button></div></form></dialog>
  <dialog id="backup-dialog" class="dialog"><form method="dialog"><h2 id="backup-title">Can't do this?</h2><p class="helper">Choose a reason, then Kitty Quest will reroute you.</p><label for="backup-reason">Why?</label><select id="backup-reason" onchange="updateBackupSafety()"><option>Too heavy</option><option>No equipment</option><option>Too difficult</option><option>Don't know how</option><option>Limited range of motion</option><option>Pain / discomfort</option></select><div id="backup-safety"></div><label id="backup-label">Try one of these instead</label><div id="backup-options" class="quests"></div><div class="dialog-actions"><button class="cancel">Close</button></div></form></dialog>

  function workouts(){const plan=workoutPlans[new Date().getDay()], logs=workoutLog(), exercises=plan.sessions.flatMap(s=>s.exercises), completed=exercises.filter(e=>logs[e.id]?.completed).length;const card=(e)=>{const log=logs[e.id]||{};return `<article class="exercise" style="${log.completed?'opacity:.58':''}"><div class="exercise-head"><span style="font-size:22px">${log.completed?'●':'⟡'}</span><div class="line-grow"><h3>${escape(log.alternative||e.name)}</h3><p>${e.sets} sets × ${e.reps} · ${escape(e.equipment)} · ${e.muscles.join(', ')}</p>${log.alternative?`<p>Rerouted from ${escape(e.name)}${log.reason?` · ${escape(log.reason)}`:''}</p>`:''}${log.completed&&log.weight?`<p>Logged: ${log.sets} × ${log.reps}${log.weight?' · '+escape(log.weight):''}</p>`:''}</div></div>${!log.completed?`<div class="exercise-actions"><button class="mini-button" onclick="openLog('${e.id}')">Log +15 XP</button><button class="mini-button" onclick="openBackup('${e.id}')">Can't do this?</button></div>`:`<p style="color:#d8c1ff;font-weight:700;margin-bottom:0">Complete · +15 XP</p>`}</article>`};return `<h1 class="page-title">Today's Training</h1><div class="card"><div class="progress-header"><b>${escape(plan.name)}</b><span>${completed} / ${exercises.length}</span></div><div class="bar"><i style="width:${exercises.length?completed/exercises.length*100:0}%"></i></div><p class="helper">${escape(plan.focus)} · Each completed exercise earns 15 XP.</p></div>${plan.sessions.map(s=>`<p class="section-title" style="margin-top:24px">${escape(s.name)}</p>${s.exercises.map(card).join('')}`).join('')}`}
  function openLog(id){const e=findExercise(id), log=workoutLog()[id]||{};activeLogContext='workout';activeExerciseId=id;document.querySelector('#log-title').textContent=log.alternative||e.name;document.querySelector('#log-plan').textContent=`Plan: ${e.sets} sets × ${e.reps} reps · ${e.difficulty}`;document.querySelector('#sets-label').textContent='Sets completed';document.querySelector('#reps-label').textContent='Reps completed';document.querySelector('#log-submit').textContent='Complete +15 XP';document.querySelector('#actual-sets').value=log.sets||e.sets;document.querySelector('#actual-reps').value=log.reps||e.reps;document.querySelector('#actual-weight').value=log.weight||'';document.querySelector('#actual-notes').value=log.notes||'';logDialog.showModal()}
  function setBackupOptions(e){document.querySelector('#backup-reason').value='Too heavy';document.querySelector('#backup-options').innerHTML=e.alternatives.map((a,i)=>`<button type="button" class="quest" onclick="selectAlternative('${e.id}',${i})"><span class="quest-icon">↪</span><span class="quest-copy"><span class="quest-title">${escape(a)}</span><span class="quest-sub">Use this as your backup exercise</span></span></button>`).join('');updateBackupSafety()}
  function openBackup(id){const e=findExercise(id);backupContext='workout';activeExerciseId=id;document.querySelector('#backup-title').textContent=`Can't do ${e.name}?`;setBackupOptions(e);backupDialog.showModal()}
  function updateBackupSafety(){const pain=document.querySelector('#backup-reason').value==='Pain / discomfort';document.querySelector('#backup-options').style.display=pain?'none':'grid';document.querySelector('#backup-label').style.display=pain?'none':'block';document.querySelector('#backup-safety').innerHTML=pain?'<div class="safety">Stop this movement. Do not push through pain. Rest, modify with a qualified professional, and seek care for significant or persistent pain.</div>':''}
  function selectAlternative(id,index){if(document.querySelector('#backup-reason').value==='Pain / discomfort')return;const reason=document.querySelector('#backup-reason').value;if(backupContext==='workout'){const logs=workoutLog(),e=findExercise(id);logs[id]={...(logs[id]||{}),alternative:e.alternatives[index],reason};state.workoutLogs[todayKey()]=logs}else{const e=findPowerTask(activePowerTask.track,id);state.power.logs[id]={...(state.power.logs[id]||{}),alternative:e.alternatives[index],reason}}save();backupDialog.close();render()}
  const findPowerTask=(track,id)=>powerTracks[track].levels.flatMap(level=>level.tasks).find(task=>task.id===id);
  function openPowerLog(track,id){const e=findPowerTask(track,id),log=state.power.logs[id]||{};activeLogContext='power';activePowerTask={track,id};document.querySelector('#log-title').textContent=log.alternative||e.name;document.querySelector('#log-plan').textContent=`Plan: ${e.sets} sets × ${e.reps} · ${e.equipment}`;document.querySelector('#sets-label').textContent='Sets / rounds completed';document.querySelector('#reps-label').textContent='Reps or duration completed';document.querySelector('#log-submit').textContent='Complete +12 XP';document.querySelector('#actual-sets').value=log.sets||e.sets;document.querySelector('#actual-reps').value=log.reps||e.reps;document.querySelector('#actual-weight').value=log.weight||'';document.querySelector('#actual-notes').value=log.notes||'';logDialog.showModal()}
  function openPowerBackup(track,id){const e=findPowerTask(track,id);backupContext='power';activePowerTask={track,id};document.querySelector('#backup-title').textContent=`Can't do ${e.name}?`;setBackupOptions(e);backupDialog.showModal()}
  function powerLevel(){return Object.values(state.power.stats).reduce((sum,value)=>sum+value,0)}
  function achievements(){const logged=Object.values(state.power.logs).filter(log=>log.completed);const has=id=>state.power.logs[id]?.completed;const level=powerLevel();return [{name:'First Power Session',ok:logged.length>0},{name:'First Heavy Bag Session',ok:has('bag-tech')||has('bag-power')},{name:'Grip Initiate',ok:state.power.stats.Grip>=1},{name:'First Farmer Carry',ok:has('farmer')},{name:'First Towel Carry',ok:has('towel-hold')},{name:'Power Level 10',ok:level>=10},{name:'Power Level 25',ok:level>=25},{name:'Power Level 50',ok:level>=50},{name:'Power Level 100',ok:level>=100},{name:'Striking Level 10',ok:state.power.stats.Striking>=10},{name:'Control Strength Level 10',ok:state.power.stats.Control>=10}];}
  function power(){const card=(track,task)=>{const log=state.power.logs[task.id]||{};return `<article class="exercise" style="${log.completed?'opacity:.58':''}"><div class="exercise-head"><span style="font-size:22px">${log.completed?'●':'✧'}</span><div class="line-grow"><h3>${escape(log.alternative||task.name)}</h3><p>${task.sets} sets × ${task.reps} · ${escape(task.equipment)}</p><p>Builds: ${Object.keys(task.stats).join(', ')}</p>${log.alternative?`<p>Rerouted from ${escape(task.name)} · ${escape(log.reason)}</p>`:''}</div></div>${log.completed?'<p style="color:#d8c1ff;font-weight:700;margin-bottom:0">Complete · +12 XP</p>':`<div class="exercise-actions"><button class="mini-button" onclick="openPowerLog('${track}','${task.id}')">Log +12 XP</button><button class="mini-button" onclick="openPowerBackup('${track}','${task.id}')">Can't do this?</button></div>`}</article>`};const achievementsHTML=achievements().map(a=>`<div class="line"><span>${a.ok?'✦':'○'}</span><span class="line-grow">${a.name}</span>${a.ok?'<small>Unlocked</small>':''}</div>`).join('');return `<h1 class="page-title">Power Level ${powerLevel()}</h1><p class="helper">Capability over appearance: get stronger, more athletic, and more confident.</p><div class="stats-grid">${powerStats.map(stat=>`<div class="stat"><small>${stat.toUpperCase()}</small><b>${state.power.stats[stat]}</b></div>`).join('')}</div>${Object.entries(powerTracks).map(([key,track])=>`<p class="section-title">${track.title.toUpperCase()}</p><div class="safety">${escape(track.description)}</div>${track.levels.map(level=>`<div class="card" style="margin:11px 0"><b>${level.name}</b>${level.tasks.map(task=>card(key,task)).join('')}</div>`).join('')}`).join('')}<p class="section-title" style="margin-top:24px">ACHIEVEMENTS</p><div class="list">${achievementsHTML}</div>`}
  document.querySelector('#log-form').addEventListener('submit',()=>{if(activeLogContext==='power'){const e=findPowerTask(activePowerTask.track,activePowerTask.id),prior=state.power.logs[e.id]||{};if(!prior.completed){Object.entries(e.stats).forEach(([stat,points])=>state.power.stats[stat]+=points);state.profile.xp+=12;state.profile.stars+=12}state.power.logs[e.id]={...prior,completed:true,sets:document.querySelector('#actual-sets').value,reps:document.querySelector('#actual-reps').value,weight:document.querySelector('#actual-weight').value,notes:document.querySelector('#actual-notes').value,completedAt:Date.now()};save();render();return}const logs=workoutLog(),prior=logs[activeExerciseId]||{};if(!prior.completed){state.profile.xp+=15;state.profile.stars+=15}logs[activeExerciseId]={...prior,completed:true,sets:document.querySelector('#actual-sets').value,reps:document.querySelector('#actual-reps').value,weight:document.querySelector('#actual-weight').value,notes:document.querySelector('#actual-notes').value,completedAt:Date.now()};state.workoutLogs[todayKey()]=logs;save();render()});
  function setEnabled(id,enabled){state.quests.find(q=>q.id===id).enabled=enabled;save();render()};function redeem(id){const r=state.rewards.find(r=>r.id===id);if(state.profile.stars>=r.cost){state.profile.stars-=r.cost;save();render()}}
  const escape=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  function render(){document.querySelector('#today').innerHTML=today();document.querySelector('#quests').innerHTML=quests();document.querySelector('#workouts').innerHTML=workouts();document.querySelector('#power').innerHTML=power();document.querySelector('#rewards').innerHTML=rewards()}
  const questDialog=document.querySelector('#quest-dialog'),logDialog=document.querySelector('#log-dialog'),backupDialog=document.querySelector('#backup-dialog');const dayNames=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];document.querySelector('#day-picker').innerHTML=dayNames.map((d,i)=>`<label><input type="checkbox" value="${i}" ${i!==0&&i!==6?'checked':''}>${d}</label>`).join('');
  function openQuestDialog(){document.querySelector('#quest-form').reset();document.querySelectorAll('#day-picker input').forEach((el,i)=>el.checked=i!==0&&i!==6);questDialog.showModal()}
  document.querySelector('#quest-form').addEventListener('submit',()=>{const title=document.querySelector('#q-title').value.trim();if(!title)return;state.quests.push({id:crypto.randomUUID(),title,hint:document.querySelector('#q-hint').value.trim()||'A small step toward your goal',category:document.querySelector('#q-category').value,xp:+document.querySelector('#q-xp').value,days:[...document.querySelectorAll('#day-picker input:checked')].map(x=>+x.value),enabled:true});save();render()});
  document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button,.screen').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelector('#'+b.dataset.page).classList.add('active');document.querySelector('.add').style.display=['rewards','workouts','power'].includes(b.dataset.page)?'none':''});
  if('serviceWorker'in navigator)navigator.serviceWorker.register('service-worker.js');render();
  </script>
</body></html>
