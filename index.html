<body>
  <main class="app">
    <section id="today" class="screen active"></section>
    <section id="quests" class="screen"></section>
    <section id="workouts" class="screen"></section>
    <section id="athletics" class="screen"></section>
    <section id="progress" class="screen"></section>
    <section id="more" class="screen"></section>
  </main>
  <button class="quick" aria-label="Quick actions" onclick="openQuick()">+</button>
  <button class="hers" onclick="openHers()">I'M HERS</button>
  <nav class="nav"><div class="nav-inner"><button class="active" data-page="today"><i>⌂</i>HOME</button><button data-page="quests"><i>⚔</i>QUESTS</button><button data-page="athletics"><i>◌</i>ATHLETICS</button><button data-page="progress"><i>▥</i>PROGRESS</button><button data-page="more"><i>⚙</i>MORE</button></div></nav>
  <dialog id="quest-dialog" class="dialog"><form id="quest-form" method="dialog">
    <h2>New Quest</h2><label for="q-title">Quest name</label><input id="q-title" required maxlength="50" placeholder="e.g. Take a lunchtime walk">
    <label for="q-hint">Helpful hint</label><input id="q-hint" maxlength="80" placeholder="A small next step">
    <label for="q-category">Category</label><select id="q-category"><option value="wellness">Wellness</option><option value="movement">Movement</option><option value="fuel">Fuel</option><option value="focus">Focus</option><option value="home">Home</option></select>
    <label for="q-xp">XP reward</label><select id="q-xp"><option>10</option><option selected>15</option><option>20</option><option>25</option><option>30</option><option>50</option></select>
    <label>Repeat on</label><div class="days" id="day-picker"></div>
    <div class="dialog-actions"><button type="button" class="cancel" onclick="questDialog.close()">Cancel</button><button class="save" value="default">Add quest</button></div>
  </form></dialog>
  <dialog id="log-dialog" class="dialog"><form id="log-form" method="dialog"><h2 id="log-title">Log exercise</h2><p id="log-plan" class="helper"></p><label id="sets-label" for="actual-sets">Sets completed</label><input id="actual-sets" inputmode="numeric" required><label id="reps-label" for="actual-reps">Reps completed</label><input id="actual-reps" inputmode="numeric" required><label for="actual-weight">Weight (optional)</label><input id="actual-weight" placeholder="e.g. 30 lb"><label for="actual-notes">Notes (optional)</label><input id="actual-notes" maxlength="100" placeholder="How did it feel?"><div class="dialog-actions"><button type="button" class="cancel" onclick="logDialog.close()">Cancel</button><button id="log-submit" class="save">Complete +15 XP</button></div></form></dialog>
  <dialog id="backup-dialog" class="dialog"><form method="dialog"><h2 id="backup-title">Can't do this?</h2><p class="helper">Choose a reason, then Kitty Quest will reroute you.</p><label for="backup-reason">Why?</label><select id="backup-reason" onchange="updateBackupSafety()"><option>Too heavy</option><option>No equipment</option><option>Too difficult</option><option>Don't know how</option><option>Limited range of motion</option><option>Pain / discomfort</option></select><div id="backup-safety"></div><label id="backup-label">Try one of these instead</label><div id="backup-options" class="quests"></div><div class="dialog-actions"><button class="cancel">Close</button></div></form></dialog>
  <dialog id="hers-dialog" class="dialog"><form method="dialog"><h2 id="hers-title">I'M HERS</h2><p id="hers-copy" class="helper">Bae has summoned you. Training is protected, not failed.</p><div id="hers-options" class="quests"></div><div class="dialog-actions"><button class="cancel">Close</button></div></form></dialog>

  const sportIcon=s=>({"Flag Football":"🏈",Rugby:"🏉",Soccer:"⚽",Basketball:"🏀",Tennis:"🎾","Track & Field":"🏃",Rowing:"🚣",Swimming:"🏊",Calisthenics:"◌",Climbing:"♧"}[s]||'✦');
  const toast=(message)=>{const t=document.querySelector('#toast');t.textContent=message;t.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove('show'),1500)};
  function today(){const day=new Date().getDay(),qs=activeQuests(),done=doneSet(),pct=qs.length?Math.round(done.size/qs.length*100):0,next=qs.find(q=>!done.has(q.id)),level=levelFromXP(),target=level*500,paused=!!state.athlete.protected;const cards=qs.filter(q=>!done.has(q.id)&&q!==next).slice(0,3);return `<div class="top"><div><h1>🐈‍⬛ KITTY QUEST</h1><p>${paused?'❤️ I\'M HERS — TRAINING PAUSED':'BEAST MODE — ACTIVE'} · 🔥 ${streak()}</p></div><div class="kitty">✦</div></div><div class="card"><div class="eyebrow">ATHLETE LEVEL</div><div class="hero-level">ATHLETE LV. ${athleteLevel()}</div>${ProgressBar(state.profile.xp%500,500,'Overall progress','large')}</div><div class="card" style="margin-top:12px"><div class="home-progress"><div><div class="eyebrow">TODAY</div><h2 style="margin:5px 0">${done.size} / ${qs.length} QUESTS</h2><p class="helper">${paused?'Everything is safely saved.':'Complete your next mission.'}</p></div><div class="today-ring" style="--pct:${pct}%"><b>${pct}%<small>TODAY</small></b></div></div></div>${paused?`<div class="card" style="margin-top:12px"><div class="eyebrow">❤️ I'M HERS</div><h2 style="margin:6px 0">Training paused.</h2><p class="helper">Everything is saved. No guilt, no penalties.</p><button class="primary" onclick="openHers()">🐈‍⬛ I'M BACK</button></div>`:next?`<div class="section-row"><p class="section-title">NEXT QUEST</p><button class="ghost" onclick="openQuick()">QUICK ACTION</button></div><div class="main-quest"><div class="quest-type">MAIN QUEST</div><h2>${icons[next.category]} ${escape(next.title)}</h2><p class="helper">${escape(next.hint)} · +${next.xp} XP</p><button class="primary" onclick="${next.category==='movement'?'openActiveWorkout()':`toggle('${next.id}')`}">${next.category==='movement'?'START':'COMPLETE'}</button></div>`:`<div class="main-quest" style="margin-top:20px"><div class="quest-type">TODAY IS CLEAR</div><h2>Mission complete.</h2><p class="helper">A recovery walk or mobility session can keep your streak strong.</p><button class="primary" onclick="openActiveWorkout()">START OPTIONAL TRAINING</button></div>`}<div class="section-row"><p class="section-title">UPCOMING</p><button class="ghost" onclick="showPage('quests')">VIEW ALL</button></div><div class="quests">${cards.map(q=>`<button class="quest" onclick="toggle('${q.id}')"><span class="quest-icon">${icons[q.category]}</span><span class="quest-copy"><span class="quest-type">${q.category==='movement'?'SIDE QUEST':'MICRO QUEST'}</span><span class="quest-title">${escape(q.title)}</span><span class="quest-sub">${escape(q.hint)}</span></span><span class="xp">+${q.xp}</span></button>`).join('')||'<div class="empty">Nothing else is urgent right now.</div>'}</div><div class="section-row"><p class="section-title">DAILY TIMELINE</p></div><div class="list timeline">${scheduleForDay(day).slice(0,5).map(i=>`<div class="line"><b style="width:72px;font-size:12px">${i[0]}</b><span class="line-grow"><small style="margin:0">🔒 ${i[1]}</small></span></div>`).join('')}</div>`}
  function quests(){const qs=activeQuests(),done=doneSet();const kind=q=>q.category==='movement'?'SIDE QUEST':q.category==='wellness'?'RECOVERY':'MICRO QUEST';const rows=title=>qs.filter(q=>kind(q)===title).map(q=>`<button class="quest ${done.has(q.id)?'done collapsed':''}" onclick="toggle('${q.id}')"><span class="quest-icon">${done.has(q.id)?'✓':icons[q.category]}</span><span class="quest-copy"><span class="quest-type">${done.has(q.id)?'COMPLETED':title}</span><span class="quest-title">${escape(q.title)}</span><span class="quest-sub">${escape(q.hint)}</span></span><span class="xp">+${q.xp}</span></button>`).join('');return `<h1 class="page-title">⚔ QUESTS</h1><div class="card"><b>TODAY</b>${ProgressBar(done.size,qs.length,`${done.size} / ${qs.length} COMPLETE`)}</div>${['SIDE QUEST','MICRO QUEST','RECOVERY'].map(title=>`<div class="section-row"><p class="section-title">${title}${title==='RECOVERY'?' QUESTS':''}</p></div><div class="quests">${rows(title)||'<div class="empty">No quests in this section.</div>'}</div>`).join('')}`}
  function athletics(){const active=['Flag Football','Rugby','Soccer','Track & Field'],season=state.athlete.season||'FALL';const sport=(name,primary=false)=>{const xp=state.athlete.sportXP[name]||0,lv=Math.floor(xp/10)+1;const status=primary?'PRIMARY':(xp?Math.round(xp%10*10)+'%':'READY');return `<button class="sport-card" onclick="openSport('${name}')"><span class="quest-icon">${sportIcon(name)}</span><span class="line-grow"><b>${name}</b>${ProgressBar(xp%10,10,`LV. ${lv}`,'compact')}</span><small>${status}</small></button>`};return `<h1 class="page-title">ATHLETICS</h1><div class="card"><div class="eyebrow">${season} · ACTIVE THIS SEASON</div>${active.map((s,i)=>sport(s,i<3)).join('')}<button class="ghost" style="margin-top:12px" onclick="toast('Season editor is next up')">EDIT SEASON</button></div><div class="section-row"><p class="section-title">ATHLETIC FOUNDATION</p><button class="ghost" onclick="openActiveWorkout()">START</button></div><div class="quests">${athleticExercises.slice(0,3).map(e=>`<button class="quest" onclick="openGuide('${e.id}')"><span class="quest-icon">◌</span><span class="quest-copy"><span class="quest-title">${e.name}</span><span class="quest-sub">${e.sets} × ${e.reps} · ${e.sport}</span></span><span class="check">›</span></button>`).join('')}</div><div class="section-row"><p class="section-title">SPORT LIBRARY</p><button class="ghost" onclick="openSport('Track & Field')">SEARCH</button></div>${sportCatalog.map((g,i)=>`<details class="card category-card" ${i===0?'open':''}><summary>${g.group.toUpperCase()}</summary><div style="margin-top:10px">${g.sports.map(s=>sport(s,active.includes(s))).join('')}</div></details>`).join('')}`}
  function progress(){const attrs=athleteAttributes.slice(0,6),completed=Object.values(state.workoutLogs).flatMap(x=>Object.values(x)).filter(x=>x.completed).length,days=Object.keys(state.logs||{}).length;return `<h1 class="page-title">▥ PROGRESS</h1><div class="card"><div class="eyebrow">ATHLETE LEVEL</div><div class="hero-level">LV. ${athleteLevel()}</div>${ProgressBar(state.profile.xp%500,500,`${state.profile.xp.toLocaleString()} TOTAL XP`,'large')}</div><div class="section-row"><p class="section-title">ATHLETE PROFILE</p><button class="ghost" onclick="toast('All attributes are shown below')">VIEW ALL</button></div><div class="card">${attrs.map(a=>`<div class="attribute-row"><b>${a.toUpperCase()}</b><span>LV. ${state.athlete.attributes[a]}</span><div class="bar compact"><i style="width:${Math.min(100,state.athlete.attributes[a]*10)}%"></i></div></div>`).join('')}</div><div class="section-row"><p class="section-title">THIS WEEK</p></div><div class="stats-grid"><div class="stat"><small>WORKOUTS</small><b>${completed}</b></div><div class="stat"><small>STREAK</small><b>🔥 ${streak()}</b></div><div class="stat"><small>XP EARNED</small><b>+${state.profile.xp}</b></div><div class="stat"><small>QUEST DAYS</small><b>${days}</b></div></div><div class="card"><b>PERSONAL RECORDS</b><p class="helper" style="margin-top:8px">NO PRs YET · Your first one is waiting.</p><button class="ghost" onclick="toast('PR recording is ready for your first test')">START A TEST</button></div><div class="card" style="margin-top:12px"><b>ATHLETE CHECKPOINT</b>${ProgressBar(2,5,'NEXT TEST: 18 DAYS')}<p class="helper">✓ Grip · ✓ Push-ups · ○ 40-yard dash · ○ Broad jump · ○ 500 m row</p></div>`}
  function more(){return `<h1 class="page-title">⚙ MORE</h1><div class="list"><button class="quest" onclick="showPage('workouts');openActiveWorkout()"><span class="quest-icon">⌁</span><span class="quest-copy"><span class="quest-title">Training plans</span><span class="quest-sub">Workouts, schedules, equipment</span></span></button><button class="quest" onclick="showPage('progress')"><span class="quest-icon">▥</span><span class="quest-copy"><span class="quest-title">History & checkpoints</span><span class="quest-sub">Consistency, records, test days</span></span></button><button class="quest" onclick="openQuestDialog()"><span class="quest-icon">+</span><span class="quest-copy"><span class="quest-title">Add quest</span><span class="quest-sub">Create a repeatable daily mission</span></span></button><button class="quest" onclick="toast('Reduce motion and haptics settings are saved on this device')"><span class="quest-icon">⚙</span><span class="quest-copy"><span class="quest-title">Accessibility & settings</span><span class="quest-sub">Motion, haptics, display</span></span></button></div><div class="section-row"><p class="section-title">REWARDS</p></div>${rewards()}`}
  function openSport(name){const xp=state.athlete.sportXP[name]||0,skills=['Foundation','Technique','Game awareness','Mastery'];document.querySelector('#guide-title').textContent=`${sportIcon(name)} ${name}`;document.querySelector('#guide-body').innerHTML=`<div class="eyebrow">SPORT LV. ${Math.floor(xp/10)+1}</div>${ProgressBar(xp%10,10,'Sport progress','large')}<p class="section-title" style="margin-top:20px">SKILL PATH</p>${skills.map((s,i)=>`<div class="line"><b>${i===0?'✓':i===1?'●':i===2?'○':'🔒'}</b><span class="line-grow"><b>${s}</b><small>${i===1?'CURRENT · train this next':i<1?'COMPLETE':'AVAILABLE AFTER FOUNDATION'}</small></span></div>`).join('')}`;guideDialog.showModal()}
  function openQuick(){document.querySelector('#quick-options').innerHTML=[['START WORKOUT','openActiveWorkout()'],['ADD WATER','quickWater()'],['ADD QUEST','openQuestDialog()'],["I'M HERS",'openHers()']].map(x=>`<button type="button" class="quest" onclick="quickDialog.close();${x[1]}"><span class="quest-copy"><span class="quest-title">${x[0]}</span></span><span class="check">›</span></button>`).join('');quickDialog.showModal()}
  function quickWater(){const q=state.quests.find(x=>x.id==='water');if(q&&!doneSet().has(q.id))toggle(q.id);toast('+ Water progress')}
  function openActiveWorkout(){const exercises=workoutPlans[new Date().getDay()].sessions.flatMap(s=>s.exercises),logs=workoutLog(),e=exercises.find(x=>!logs[x.id]?.completed)||exercises[0],index=exercises.indexOf(e),target=parseInt(String(e.reps))||12;state.ui=state.ui||{};state.ui.active={id:e.id,reps:state.ui.active?.id===e.id?state.ui.active.reps:0,target};const a=state.ui.active;document.querySelector('#active-body').innerHTML=`<div class="active-workout"><div class="eyebrow">${sportIcon('Flag Football')} FLAG FOOTBALL · ROUTE FUNDAMENTALS</div>${ProgressBar(index,exercises.length,`EXERCISE ${index+1} / ${exercises.length}`,'standard')}<div class="exercise-big">${escape(e.name)}</div><p class="helper">${e.sets} × ${e.reps}</p><div class="rep-counter"><button type="button" onclick="adjustRep(-1)">−</button><strong onclick="adjustRep(1)">${a.reps}</strong><small>/ ${a.target}</small><button type="button" onclick="adjustRep(1)">+</button></div>${ProgressBar(a.reps,a.target,`SET 1 / ${e.sets}`,'large')}<div class="workout-actions"><button type="button" class="primary" onclick="finishActive()">✓ COMPLETE</button><div class="row"><button type="button" class="ghost" onclick="activeDialog.close();openGuide('${e.id.includes('a-skip')?'a-skip':'wall-march'}')">❓ HOW DO I DO THIS?</button><button type="button" class="ghost" onclick="activeDialog.close();openBackup('${e.id}')">🔄 CAN'T DO THIS?</button></div><div class="row"><button type="button" class="ghost" onclick="toast('Workout paused — progress saved')">PAUSE</button><button type="button" class="ghost" onclick="activeDialog.close()">END</button></div></div></div>`;if(!activeDialog.open)activeDialog.showModal()}
  function adjustRep(n){state.ui.active.reps=Math.max(0,Math.min(state.ui.active.target,state.ui.active.reps+n));save();openActiveWorkout()}
  function finishActive(){const a=state.ui.active,e=findExercise(a.id),logs=workoutLog(),prior=logs[a.id]||{};if(!prior.completed){state.profile.xp+=15;state.profile.stars+=15}logs[a.id]={...prior,completed:true,sets:e.sets,reps:a.target,completedAt:Date.now()};state.workoutLogs[todayKey()]=logs;save();activeDialog.close();toast('+15 XP · QUEST COMPLETE');render()}
  function showPage(page){document.querySelectorAll('.nav button,.screen').forEach(x=>x.classList.remove('active'));const nav=document.querySelector(`.nav [data-page="${page}"]`);if(nav)nav.classList.add('active');const screen=document.querySelector('#'+page);if(screen)screen.classList.add('active')}
  function render(){document.querySelector('#today').innerHTML=today();document.querySelector('#quests').innerHTML=quests();document.querySelector('#workouts').innerHTML=workouts();document.querySelector('#athletics').innerHTML=athletics();document.querySelector('#progress').innerHTML=progress();document.querySelector('#more').innerHTML=more()}
  const questDialog=document.querySelector('#quest-dialog'),logDialog=document.querySelector('#log-dialog'),backupDialog=document.querySelector('#backup-dialog'),hersDialog=document.querySelector('#hers-dialog'),guideDialog=document.querySelector('#guide-dialog'),quickDialog=document.querySelector('#quick-dialog'),activeDialog=document.querySelector('#active-dialog');const dayNames=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];document.querySelector('#day-picker').innerHTML=dayNames.map((d,i)=>`<label><input type="checkbox" value="${i}" ${i!==0&&i!==6?'checked':''}>${d}</label>`).join('');
  function openQuestDialog(){document.querySelector('#quest-form').reset();document.querySelectorAll('#day-picker input').forEach((el,i)=>el.checked=i!==0&&i!==6);questDialog.showModal()}
  document.querySelector('#quest-form').addEventListener('submit',()=>{const title=document.querySelector('#q-title').value.trim();if(!title)return;state.quests.push({id:crypto.randomUUID(),title,hint:document.querySelector('#q-hint').value.trim()||'A small step toward your goal',category:document.querySelector('#q-category').value,xp:+document.querySelector('#q-xp').value,days:[...document.querySelectorAll('#day-picker input:checked')].map(x=>+x.value),enabled:true});save();render()});
  document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>showPage(b.dataset.page));
  if('serviceWorker'in navigator)navigator.serviceWorker.register('service-worker.js');render();
  </script>
</body></html>
