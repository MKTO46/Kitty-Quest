  const completed=(key=todayKey())=>new Set(state.logs[key]||[]);
  const humanDate=new Intl.DateTimeFormat(undefined,{weekday:'long',month:'short',day:'numeric'}).format(new Date());
  const routine={0:[['Morning','At-home day: shower, meal, home full-body training'],['Afternoon','Meal, then pull-up / grip / calisthenics'],['Evening','Core + mobility + walking, measurements, shower, 10 PM sleep']],1:[['5:30 AM','Wake, shower, get ready, pack meals and water'],['6:10 AM','Leave for school'],['8:05–8:40','Nap / reset before class'],['9:30–10:45','Class'],['10:45 AM','Two-hour drive to the gym'],['12:45 PM','Main lifting, meal, then later easy cardio'],['Evening','Drive home, dinner, 9:30 shower, 10 PM sleep']],2:[['4:45 AM','Wake, shower, get ready, pack food and water'],['5:25 AM','Leave for school — long commute'],['7:25–7:45','Arrive; nap if appropriate'],['9:30–10:45','Class'],['10:45 AM','Two-hour drive to the gym'],['12:45 PM','Main lifting, meal, then later easy cardio'],['Evening','Drive home, dinner, 9:30 shower, 10 PM sleep']],3:[['5:30 AM','Wake, shower, get ready, pack meals and water'],['6:10 AM','Leave for school'],['8:05–8:40','Nap / reset before class'],['9:30–10:45','Class'],['10:45 AM','Two-hour drive to the gym'],['12:45 PM','Main lifting, meal, then later easy cardio'],['Evening','Drive home, dinner, 9:30 shower, 10 PM sleep']],4:[['4:45 AM','Wake, shower, get ready, pack food and water'],['5:25 AM','Leave for school — long commute'],['7:25–7:45','Arrive; nap if appropriate'],['9:30–10:45','Class'],['10:45 AM','Two-hour drive to the gym'],['12:45 PM','Main lifting, meal, then later easy cardio'],['Evening','Drive home, dinner, 9:30 shower, 10 PM sleep']],5:[['Morning','Shower, then Gym #1 — Upper'],['Midday','Meal, then Gym #2 — Legs'],['Later','Meal, then Gym #3 — Cardio / walking'],['Evening','Dinner, shower, sleep']],6:[['Morning','Shower, then Gym #1 — Upper'],['Midday','Meal, then Gym #2 — Pull-up / grip'],['Later','Meal, then Gym #3 — Cardio / walking'],['Evening','Dinner, shower, sleep']]};
  function streak(){let d=new Date(), n=0; const due=active(d), done=completed(); if(!due.every(q=>done.has(q.id)))d.setDate(d.getDate()-1); while(true){const qs=active(d);if(qs.length&&!qs.every(q=>completed(d.toLocaleDateString('en-CA')).has(q.id)))return n;if(qs.length)n++;d.setDate(d.getDate()-1)}}
  function toggle(id){const key=todayKey(), set=completed();const q=state.quests.find(q=>q.id===id);if(set.has(id)){set.delete(id);state.profile.xp-=q.xp;state.profile.stars-=q.xp}else{set.add(id);state.profile.xp+=q.xp;state.profile.stars+=q.xp}state.logs[key]=[...set];save();render()}
  const questGroup=q=>q.group||(q.id.startsWith('meal')||q.id==='water'?'Food + water':q.id.includes('shower')||q.id.startsWith('pm-')||q.id==='sleep'?'Night routine':q.id==='class'||q.id.includes('school')||q.id.includes('commute')?'School mode':q.category==='movement'?'Training':'Daily quests');
  function dayNumber(){return Math.max(1,Math.floor((Date.now()-new Date(state.profile.startDate||todayKey()))/86400000)+1)}
  function today(){const qs=active(), done=completed(), earned=qs.filter(q=>done.has(q.id)).reduce((a,q)=>a+q.xp,0);const level=Math.floor(state.profile.xp/100)+1,day=new Date().getDay(),next=qs.find(q=>!done.has(q.id)),groups=[...new Set(qs.map(questGroup))];const row=q=>`<button class="quest ${done.has(q.id)?'done':''}" onclick="toggle('${q.id}')"><span class="quest-icon">${icons[q.category]}</span><span class="quest-copy"><span class="quest-title">${escape(q.title)}</span><span class="quest-sub">${escape(q.hint)}</span></span><span class="xp">+${q.xp}</span><span class="check">${done.has(q.id)?'●':'○'}</span></button>`;return `<div class="top"><div><h1>KITTY QUEST</h1><p>DAY ${dayNumber()} · Transformation Mode</p></div><div class="kitty">🐱</div></div><div class="card"><div class="progress-header"><b>Level ${level} · ${state.profile.xp%100} / 100 XP</b><span>${Math.round(qs.length?done.size/qs.length*100:0)}%</span></div><div class="bar"><i style="width:${qs.length?done.size/qs.length*100:0}%"></i></div><p class="helper">${done.size} of ${qs.length} daily quests · ${streak()} day streak</p></div>${next?`<p class="section-title" style="margin-top:24px">NEXT QUEST</p><button class="quest" onclick="toggle('${next.id}')"><span class="quest-icon">${icons[next.category]}</span><span class="quest-copy"><span class="quest-title">${escape(next.title)}</span><span class="quest-sub">Reward: +${next.xp} XP · Complete →</span></span><span class="check">○</span></button>`:''}<p class="section-title" style="margin-top:24px">TODAY AT A GLANCE</p><div class="list">${routine[day].map(item=>`<div class="line"><b style="width:82px;font-size:12px">${item[0]}</b><span class="line-grow"><small style="margin:0">${item[1]}</small></span></div>`).join('')}</div>${groups.map(group=>`<p class="section-title" style="margin-top:24px">${group.toUpperCase()}</p><div class="quests">${qs.filter(q=>questGroup(q)===group).map(row).join('')}</div>`).join('')}`}
  function quests(){return `<h1 class="page-title">Quest Book</h1><div class="list">${state.quests.map(q=>`<div class="line"><span class="quest-icon">${icons[q.category]}</span><span class="line-grow"><b>${escape(q.title)}</b><small>${q.xp} XP · ${q.days.length===7?'Every day':q.days.map(d=>['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d]).join(', ')}</small></span><input class="toggle" type="checkbox" ${q.enabled?'checked':''} onchange="setEnabled('${q.id}',this.checked)"></div>`).join('')}</div>`}
  function rewards(){return `<h1 class="page-title">Rewards</h1><div class="card reward-line"><span style="font-size:26px">⭐</span><b style="margin-left:10px">${state.profile.stars} stars to spend</b></div><p class="section-title" style="margin-top:25px">TREAT YOURSELF</p><div class="list">${state.rewards.map(r=>`<div class="line"><span class="quest-icon">${r.icon}</span><span class="line-grow"><b>${escape(r.title)}</b><small class="cost">${r.cost} ★</small></span><button class="redeem" ${state.profile.stars<r.cost?'disabled':''} onclick="redeem('${r.id}')">Redeem</button></div>`).join('')}</div>`}
  let activeExerciseId=null;
  const workoutLog=()=>state.workoutLogs[todayKey()]||{};
  const findExercise=id=>workoutPlans[new Date().getDay()].sessions.flatMap(s=>s.exercises).find(e=>e.id===id);
  function workouts(){const plan=workoutPlans[new Date().getDay()], logs=workoutLog(), exercises=plan.sessions.flatMap(s=>s.exercises), completed=exercises.filter(e=>logs[e.id]?.completed).length;const card=(e)=>{const log=logs[e.id]||{};return `<article class="exercise" style="${log.completed?'opacity:.58':''}"><div class="exercise-head"><span style="font-size:22px">${log.completed?'✅':'🏋️'}</span><div class="line-grow"><h3>${escape(log.alternative||e.name)}</h3><p>${e.sets} sets × ${e.reps} · ${escape(e.equipment)} · ${e.muscles.join(', ')}</p>${log.alternative?`<p>Rerouted from ${escape(e.name)}${log.reason?` · ${escape(log.reason)}`:''}</p>`:''}${log.completed&&log.weight?`<p>Logged: ${log.sets} × ${log.reps}${log.weight?' · '+escape(log.weight):''}</p>`:''}</div></div>${!log.completed?`<div class="exercise-actions"><button class="mini-button" onclick="openLog('${e.id}')">Log +15 XP</button><button class="mini-button" onclick="openBackup('${e.id}')">Can't do this?</button></div>`:`<p style="color:#39835a;font-weight:700;margin-bottom:0">Complete · +15 XP</p>`}</article>`};return `<h1 class="page-title">Today's Training</h1><div class="card"><div class="progress-header"><b>${escape(plan.name)}</b><span>${completed} / ${exercises.length}</span></div><div class="bar"><i style="width:${exercises.length?completed/exercises.length*100:0}%"></i></div><p class="helper">${escape(plan.focus)} · Each completed exercise earns 15 XP.</p></div>${plan.sessions.map(s=>`<p class="section-title" style="margin-top:24px">${escape(s.name)}</p>${s.exercises.map(card).join('')}`).join('')}`}
  function openLog(id){const e=findExercise(id), log=workoutLog()[id]||{};activeExerciseId=id;document.querySelector('#log-title').textContent=log.alternative||e.name;document.querySelector('#log-plan').textContent=`Plan: ${e.sets} sets × ${e.reps} reps · ${e.difficulty}`;document.querySelector('#actual-sets').value=log.sets||e.sets;document.querySelector('#actual-reps').value=log.reps||e.reps;document.querySelector('#actual-weight').value=log.weight||'';document.querySelector('#actual-notes').value=log.notes||'';logDialog.showModal()}
  function openBackup(id){const e=findExercise(id);activeExerciseId=id;document.querySelector('#backup-title').textContent=`Can't do ${e.name}?`;document.querySelector('#backup-options').innerHTML=e.alternatives.map((a,i)=>`<button type="button" class="quest" onclick="selectAlternative('${id}',${i})"><span class="quest-icon">↪</span><span class="quest-copy"><span class="quest-title">${escape(a)}</span><span class="quest-sub">Use this as your backup exercise</span></span></button>`).join('');backupDialog.showModal()}
  function selectAlternative(id,index){const logs=workoutLog(), e=findExercise(id);logs[id]={...(logs[id]||{}),alternative:e.alternatives[index],reason:document.querySelector('#backup-reason').value};state.workoutLogs[todayKey()]=logs;save();backupDialog.close();render()}
  document.querySelector('#log-form').addEventListener('submit',()=>{const logs=workoutLog(),prior=logs[activeExerciseId]||{};if(!prior.completed){state.profile.xp+=15;state.profile.stars+=15}logs[activeExerciseId]={...prior,completed:true,sets:document.querySelector('#actual-sets').value,reps:document.querySelector('#actual-reps').value,weight:document.querySelector('#actual-weight').value,notes:document.querySelector('#actual-notes').value,completedAt:Date.now()};state.workoutLogs[todayKey()]=logs;save();render()});
  function setEnabled(id,enabled){state.quests.find(q=>q.id===id).enabled=enabled;save();render()};function redeem(id){const r=state.rewards.find(r=>r.id===id);if(state.profile.stars>=r.cost){state.profile.stars-=r.cost;save();render()}}
  const escape=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  function render(){document.querySelector('#today').innerHTML=today();document.querySelector('#quests').innerHTML=quests();document.querySelector('#workouts').innerHTML=workouts();document.querySelector('#rewards').innerHTML=rewards()}
  const questDialog=document.querySelector('#quest-dialog'),logDialog=document.querySelector('#log-dialog'),backupDialog=document.querySelector('#backup-dialog');const dayNames=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];document.querySelector('#day-picker').innerHTML=dayNames.map((d,i)=>`<label><input type="checkbox" value="${i}" ${i!==0&&i!==6?'checked':''}>${d}</label>`).join('');
  function openQuestDialog(){document.querySelector('#quest-form').reset();document.querySelectorAll('#day-picker input').forEach((el,i)=>el.checked=i!==0&&i!==6);questDialog.showModal()}
  document.querySelector('#quest-form').addEventListener('submit',()=>{const title=document.querySelector('#q-title').value.trim();if(!title)return;state.quests.push({id:crypto.randomUUID(),title,hint:document.querySelector('#q-hint').value.trim()||'A small step toward your goal',category:document.querySelector('#q-category').value,xp:+document.querySelector('#q-xp').value,days:[...document.querySelectorAll('#day-picker input:checked')].map(x=>+x.value),enabled:true});save();render()});
  document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button,.screen').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelector('#'+b.dataset.page).classList.add('active');document.querySelector('.add').style.display=['rewards','workouts'].includes(b.dataset.page)?'none':''});
  if('serviceWorker'in navigator)navigator.serviceWorker.register('service-worker.js');render();
  </script>
</body></html>
