<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07060b"><meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="app-icon.png"><link rel="stylesheet" href="styles.css"><title>Kitty Quest 2.0: Dominance</title>
</head>
<body>
  <main class="app" id="app" aria-live="polite"></main>
  <button class="caelum-button" id="caelum-open" aria-label="Open Caelum command bar">◉</button>
  <dialog id="sheet"><section id="sheet-content"></section></dialog>
  <dialog id="command-sheet"><form method="dialog" class="command"><div class="eyebrow">CAELUM // ONLINE</div><h2>Command bar</h2><input id="command-input" placeholder="What are we doing today?" autocomplete="off"><p class="hint">Try: “move workout to tonight”, “add 16 water”, or “what's next?”</p><div id="command-result"></div><div class="actions"><button class="ghost">Close</button><button class="primary" id="command-run" value="default">Run command</button></div></form></dialog>
  <script type="module" src="boot-v1.js"></script>
</body></html>
